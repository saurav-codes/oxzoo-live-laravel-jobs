# Laravel needs an ox.toml for [storage] keep; the start, install, migrate,
# health and PHP packages still come from detection.

[build]
commands = ["php artisan zoo:stamp"]

[workers]
queue = "exec php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600"

[cron]
scheduler = { schedule = "* * * * *", run = "php artisan schedule:run" }

[services]
mysql = {}
redis = {}

[storage]
keep = ["storage"]
